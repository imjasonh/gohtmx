<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repository Browser</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GitHub Repository Browser</h1>
            <p class="subtitle">Browse public GitHub repositories</p>
        </header>

        <main>
            <form class="repo-form" onsubmit="event.preventDefault(); const parts = this.repo.value.split('/'); if (parts.length >= 2) window.location.href = '/browse/' + parts[0] + '/' + parts[1];">
                <input type="text" name="repo" placeholder="Enter owner/repo (e.g., golang/go)" required>
                <button type="submit">Browse</button>
            </form>
        </main>
    </div>
</body>
</html>
